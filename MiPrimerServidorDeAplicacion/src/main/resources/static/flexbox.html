<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajando la caja flexible</title>
    <style>
        .contenedor{
            border: 2px solid black;
            padding: 10px;
            background: #f0f0f0;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            height: 300px;
            flex-direction: column;
        }
        .caja{
            background: #0056b3;
            color: white;
            width: 80px;
            height: 60px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
    </div>

</body>
</html>
